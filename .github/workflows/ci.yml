name: CI

on:
  push:
  pull_request:

jobs:
  Autobahn-server:
    name: Autobahn server (PHP ${{ matrix.php }}, ${{ matrix.rep }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rep: [a, b, c]
        php:
          - 7.4
          - 8.0
          - 8.1
          - 8.2
          - 8.3
          - 8.4
          - 8.5
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: free -m; nproc; swapon --show
      - run: while sleep 2; do echo "$(date +%T) $(free -m | awk '/^Mem:/ {print "used=" $3, "avail=" $7} /^Swap:/ {print "swap=" $3}' | xargs) $(ps -eo rss=,comm= --sort=-rss | head -3 | xargs)"; done > mem.log &
      - run: docker pull crossbario/autobahn-testsuite
      - run: composer install
      - run: php -d memory_limit=256M tests/ab/startServer.php &
      - run: until curl -I --no-progress-meter http://localhost:9001/; do sleep 0.1; done
        timeout-minutes: 1
      - run: docker run --name ab -e PYTHONUNBUFFERED=1 -v "$PWD/tests/ab":/config -v "$PWD/tests/ab/reports":/reports --add-host host.docker.internal:host-gateway crossbario/autobahn-testsuite pypy /config/wstest-gc.py -m fuzzingclient -s /config/fuzzingclient.json
        timeout-minutes: 25
      - run: docker inspect -f 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' ab
        if: ${{ always() }}
      - run: sudo dmesg -T | grep -iE 'oom|killed process|out of memory' | tail -30
        if: ${{ always() }}
      - run: sort -t= -k2 -n mem.log | tail -5; tail -40 mem.log
        if: ${{ always() }}
      - run: jq -ec '.[] | map_values(.behavior | select(IN("OK", "NON-STRICT", "INFORMATIONAL") | not)) | ., . == {}' tests/ab/reports/servers/index.json
